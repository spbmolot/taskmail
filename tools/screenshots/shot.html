<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Снимок для магазина</title>
  <style>
    /* Холст ровно под требования Chrome Web Store: 1280×800. */
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }

    body {
      display: flex;
      align-items: center;
      gap: 64px;
      padding: 0 80px;
      box-sizing: border-box;
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #eef0fe 0%, #f7f8fc 55%, #e9ecfb 100%);
      color: #16181d;
    }

    body.dark {
      background: linear-gradient(135deg, #1b1c2b 0%, #16181c 55%, #1f2130 100%);
      color: #e8eaee;
    }

    .text { flex: 1; max-width: 470px; }

    h1 {
      font-size: 44px;
      line-height: 1.15;
      font-weight: 650;
      margin: 0 0 20px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 21px;
      line-height: 1.5;
      margin: 0;
      color: #4a5060;
    }

    body.dark p { color: #a7adb8; }

    .points { margin-top: 28px; font-size: 18px; line-height: 2; color: #4a5060; }
    body.dark .points { color: #a7adb8; }
    .points span { display: block; }

    /* Окно расширения: тень и скругление, как у настоящего всплывающего окна. */
    .window {
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(22, 24, 29, 0.28), 0 2px 8px rgba(22, 24, 29, 0.12);
      background: #fff;
      flex: none;
    }

    body.dark .window { background: #16181c; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55); }

    iframe { display: block; border: 0; }
  </style>
</head>
<body>
  <div class="text">
    <h1 id="title"></h1>
    <p id="lead"></p>
    <div class="points" id="points"></div>
  </div>

  <div class="window" id="window">
    <iframe id="frame" title="Интерфейс расширения"></iframe>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const dark = params.get('dark') === '1';
    const base = dark ? '../dark/src' : '../src';

    document.body.classList.toggle('dark', dark);
    document.getElementById('title').textContent = params.get('title') || '';
    document.getElementById('lead').textContent = params.get('lead') || '';
    document.getElementById('points').innerHTML = (params.get('points') || '')
      .split('|')
      .filter(Boolean)
      .map((line) => '<span>' + line + '</span>')
      .join('');

    const frame = document.getElementById('frame');
    const page = params.get('page') || 'popup';
    const width = page === 'editor' ? 440 : 380;
    const height = Number(params.get('height') || 600);

    frame.width = width;
    frame.height = height;
    frame.src = page === 'editor' ? base + '/editor/editor.html?draft=d1' : base + '/popup/popup.html';

    // Некоторым снимкам нужен экран, который открывается действием: например,
    // панель настроек. Кликаем внутри кадра — источник тот же, доступ есть.
    frame.addEventListener('load', () => {
      const action = params.get('action');
      if (!action) return;
      const doc = frame.contentDocument;
      setTimeout(() => {
        const button = doc.getElementById(action);
        if (button) button.click();
      }, 250);
    });
  </script>
</body>
</html>
